# Y480 Nginx 站点配置（纯静态，HTTPS + 安全头 + gzip + 404 跳首页）
# 用法：
#   sudo cp dev-tools-nav-nginx.conf /etc/nginx/sites-available/dev-tools-nav.conf
#   sudo ln -sf /etc/nginx/sites-available/dev-tools-nav.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# HTTP 先启动验证后 → certbot 自动改 server块 for 443 + acme挑战

server {
    listen 80;
    listen [::]:80;

    # 选一种: ① 内网IP ②本地localhost ③Y480 hostname ④公网域名（有公网A记录时）
    server_name _ 192.168.0.0/16 10.0.0.0/8 127.0.0.1 localhost dev-tools-nav-y480.local;

    root /var/www/dev-tools-nav;
    index index.html;
    charset utf-8;

    # 日志：Y480 SSD 空间小，仅 warn+error
    access_log /var/log/nginx/dev-tools-nav.access.log;
    error_log  /var/log/nginx/dev-tools-nav.error.log warn;

    # 自动索引禁止
    autoindex off;

    # 安全头（HSTS 先不上；HTTPS 起来后加 max-age=31536000）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups";
    add_header Cross-Origin-Resource-Policy "cross-origin";

    # gzip（节省 70% 带宽；文本类）
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml application/vnd.ms-fontobject
        image/svg+xml font/opentype;

    # 静态资源长缓存（rollup bundle.hashless，内容改动文件名不变 但 .html no-cache）
    location ~* \.(html|json)$ { expires -1; add_header Cache-Control "no-cache, must-revalidate"; }
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp|avif|xml|rss|atom)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # tools/* 子目录 index.html
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # 单页工具目录：tools/  pages/  search-console.html 直链
    location ~ ^/(tools|pages|ai|blog)/ { try_files $uri $uri/ $uri/index.html =404; }

    # 搜索引擎爬虫友好 sitemap/robots/feed
    location = /sitemap.xml { access_log off; }
    location = /robots.txt  { access_log off; }
    location = /feed.xml     { access_log off; }
    location = /favicon.svg  { access_log off; }

    # 404：SPA 友好，返回首屏（但纯静态站，返回自定义404页+home CTA）
    error_page 404 /index.html;

    # 部署信息：HEAD 查状态，不对外暴露
    location = /.deploy-sha { internal; return 200 ""; }

    # 禁止访问 .git / .env / 备份
    location ~ /\.(?!well-known) { deny all; }
    location ~ (\.bak|\.swp|~)$         { deny all; }
    location ~ (package-lock\.json|package\.json|node_modules/) { deny all; }
}
