name: ✨ 功能需求
description: 提出新功能、改进或优化建议
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提出新想法！请先查看 [产品路线图](https://github.com/SongYuanKun/dev-tools-nav/blob/main/docs/roadmap.md) 确认该需求不在计划中，再填写下方内容。
  - type: checkboxes
    id: prerequisites
    attributes:
      label: 提报前检查
      options:
        - label: 我已搜索现有 Issue，确认没有人提出相同的功能需求
          required: true
        - label: 我已确认该需求不违反 [贡献指南](https://github.com/SongYuanKun/dev-tools-nav/blob/main/CONTRIBUTING.md) 中「不接受」的条目
          required: true
  - type: dropdown
    id: kind
    attributes:
      label: 需求类型
      options:
        - 新功能（新增在线工具 / 专题模块）
        - 用户体验改进（交互、性能、无障碍）
        - 工具目录变更（新增 / 更新 / 移除收录条目）
        - 文档或示例改进
        - CI / 部署 / 运维相关
        - 其他（请在描述中说明）
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 当前痛点
      description: 描述一下你遇到了什么问题，或者希望改善什么场景。
      placeholder: 例：「每次把 SQL 粘进在线格式化，输出的缩进风格与团队规范不一致。」
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 你建议的解决方案
      description: 描述你想要的功能行为或实现思路。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案（可选）
      description: 你考虑过的其他实现方式或折中方案。
  - type: textarea
    id: additional
    attributes:
      label: 参考 / 补充信息
      description: 截图、竞品示例、原型链接或任何其他相关上下文。
