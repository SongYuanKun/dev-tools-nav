name: Sync open source radar

on:
  schedule:
    # 每周一 10:00（北京时间）更新雷达
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    if: github.repository == 'SongYuanKun/dev-tools-nav' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Sync AI open source radar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync-open-source-radar.py

      - name: Push changes and dispatch Test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/publish-sync-update.sh data/open-source-radar.json "chore: 同步 AI 开源项目雷达周报"
