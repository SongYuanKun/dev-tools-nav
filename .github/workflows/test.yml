name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full SHA of the main commit to test
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: test-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || inputs.expected_sha || 'pr' }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changed-files:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code_changed: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'index.html'
              - 'favicon.svg'
              - 'robots.txt'
              - 'rollup.config.mjs'
              - 'package*.json'
              - 'tools/**'
              - 'pages/**'
              - 'js/**'
              - 'css/**'
              - 'assets/**'
              - 'data/**'
              - 'scripts/**'
              - 'content/**'
              - '.github/workflows/**'

  unit:
    needs: changed-files
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (needs.changed-files.result == 'success' && needs.changed-files.outputs.code_changed == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify dispatch target
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main || "$EXPECTED_SHA" != "$GITHUB_SHA" ]]; then
            echo '::error::Test dispatch must target the expected main SHA.'
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify checkout SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-chromium-
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Run npm test
        run: npm test
      - name: Run npm run check:asset-versions
        run: npm run check:asset-versions
      - name: Run npm run check:generated
        run: npm run check:generated
      - name: Check accessibility and performance baseline
        run: node scripts/a11y-performance-gate.mjs
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ github.sha }}
          path: /tmp/npm-test*.log
          if-no-files-found: ignore
          retention-days: 7
