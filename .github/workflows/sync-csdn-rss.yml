name: Sync CSDN articles

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    if: github.repository == 'SongYuanKun/dev-tools-nav' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Fetch RSS and update JSON
        env:
          CSDN_RSS_URL: https://blog.csdn.net/syk123839070/rss/list
        run: python3 scripts/sync-csdn-rss.py

      - name: Push changes and dispatch Test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/publish-sync-update.sh data/csdn-articles.json "chore: 同步 CSDN 最新文章列表"
